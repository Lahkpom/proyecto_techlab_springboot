spring.application.name=proyecto_techlab_springboot
#server.port=8080

# Conexión JDBC a Supabase
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_NAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase Storage Configuration para usar el bucket para las imágenes
supabase.url=${SUPABASE_URL}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET}

# Configuración Hibernate
## No quiero que hibernate haga los ddl, eso lo sigo haciendo yo desde la db, por eso pongo validate
spring.jpa.hibernate.ddl-auto=validate
## Esto es para que muestre por consola la interacción entre el back y la db
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración Logger Lombok
logging.level.com.proyecto.proyecto_techlab_springboot=INFO

# Definir un prefijo global para todos los controladores
spring.mvc.api-prefix=/api

# Clave secreta en Base64 (mínimo 256 bits). Se puede generar una desde la terminal con: openssl rand -base64 32
application.security.jwt.secret-key=${SPRING_SECRET_SHA256_KEY}
# Duración del Access Token en milisegundos (ej: 15 minutos = 900.000 ms)
application.security.jwt.expiration=900000